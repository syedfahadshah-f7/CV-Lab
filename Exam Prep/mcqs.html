*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:820px;margin-inline:auto}
header{padding-block:30px 12px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-size:clamp(26px,5vw,36px);margin:6px 0;text-wrap:balance}
.lede{color:var(--muted);margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 13px var(--body);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{margin-left:auto;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.btn{font:500 13px var(--body);padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.qt{font-weight:600;margin:6px 0 10px}
.qt code,.why code,.opt code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.opts{display:grid;gap:7px}
.opt{text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer;display:flex;gap:10px}
.opt b{font-family:var(--mono);color:var(--muted)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right b{color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong b{color:var(--bad)}
.why{margin-top:10px;font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.why strong{color:var(--fg)}

Q.sort((a,b)=>a[0]-b[0]);
// Fixed shuffle of options so the correct letter is spread across A-D (same order on every load)
Q.forEach((q,i)=>{
  let s=(i+1)*9301+49297; const rnd=()=>(s=(s*233280+49297)%2147483647)/2147483647;
  const idx=[0,1,2,3]; for(let k=3;k>0;k--){const j=Math.floor(rnd()*(k+1)); [idx[k],idx[j]]=[idx[j],idx[k]];}
  q[3]=idx.map(k=>q[3][k]); q[4]=idx.indexOf(q[4]);
});

let filter = 0, revealAll = false; const answered = {};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

function chips(){
  const c = document.getElementById('chips'); c.innerHTML='';
  [[0,'All']].concat(Object.entries(LABS)).forEach(([k,v])=>{
    const n = k==0 ? Q.length : Q.filter(q=>q[0]==k).length;
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.textContent=v+' ('+n+')'; b.setAttribute('aria-pressed', filter==k);
    b.onclick=()=>{filter=+k; chips(); render();}; c.appendChild(b);
  });
}
function render(){
  const list=document.getElementById('list'); list.innerHTML='';
  Q.forEach((q,i)=>{
    if(filter && q[0]!==filter) return;
    const d=document.createElement('div'); d.className='q';
    const pick=answered[i]; const show=revealAll||pick!==undefined;
    d.innerHTML='<div class="meta">'+LABS[q[0]]+' · '+esc(q[1])+' · Q'+(i+1)+'</div><div class="qt">'+fmt(q[2])+'</div>';
    const o=document.createElement('div'); o.className='opts';
    q[3].forEach((t,j)=>{
      const b=document.createElement('button'); b.type='button'; b.className='opt';
      if(show && j===q[4]) b.classList.add('right');
      if(pick===j && j!==q[4]) b.classList.add('wrong');
      b.innerHTML='<b>'+'ABCD'[j]+'</b><span>'+fmt(t)+'</span>';
      b.onclick=()=>{ if(answered[i]===undefined){answered[i]=j; render(); score();} };
      o.appendChild(b);
    });
    d.appendChild(o);
    if(show){const w=document.createElement('div'); w.className='why'; w.innerHTML='<strong>Answer '+'ABCD'[q[4]]+'.</strong> '+fmt(q[5]); d.appendChild(w);}
    list.appendChild(d);
  });
}
function score(){
  const ids=Object.keys(answered).filter(i=>!filter||Q[i][0]===filter);
  const ok=ids.filter(i=>answered[i]===Q[i][4]).length;
  document.getElementById('score').textContent='Score '+ok+' / '+ids.length+' answered';
}
document.getElementById('reveal').onclick=e=>{revealAll=!revealAll; e.target.textContent=revealAll?'Hide answers':'Show all answers'; render();};
document.getElementById('reset').onclick=()=>{for(const k in answered) delete answered[k]; revealAll=false; document.getElementById('reveal').textContent='Show all answers'; render(); score();};
chips(); render(); score();
</script>
